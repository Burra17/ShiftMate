name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShiftMate/shiftmate-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ShiftMate/shiftmate-frontend/.nvmrc
          cache: npm
          cache-dependency-path: ShiftMate/shiftmate-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
